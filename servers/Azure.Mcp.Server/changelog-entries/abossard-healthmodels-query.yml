changes:
  - section: "Features Added"
    description: |
      Added `azmcp monitor healthmodels query` to run a batch of typed, read-only Azure Monitor Health Model queries in a single call. Supported query kinds are entity list (optionally point-in-time), entity get, entity health history, signal history, signal recommendations, data annotations, relationship list, and signal definition list. Relationship list returns the model's parent/child dependency edges, so a `WorstOf` rollup can be explained by joining an entity's `signalGroups.dependencies` with the children it aggregates; signal definition list returns the model's signal definitions with their evaluation thresholds. A `signalName` for signal history is scoped to the target entity and is read from that entity's own signal groups with `fields: ["signals"]`, because an unrecognized name returns an empty history rather than an error. Both new kinds are model-scope reads that accept only `asOf` and `page.cursor` and reject entity-scoped input by name. Each `kind` is its own closed type carrying exactly the inputs it accepts, and the option description is the JSON Schema for the batch rather than prose, so a field belonging to another kind is rejected by name instead of being silently ignored, and `kind` may appear at any position. Request and response share one `page.cursor` concept in place of the former `nextMarker`/`continuationToken` pair. A stateless functional planner groups queries by model, deduplicates identical calls, and reuses one entity-list page for health-filtered queries. Results are compact by default with closed typed field groups for additional SDK fields. API-native pagination returns exactly one service page with explicit `page.complete` and `page.returnedCount`; callers resume any page by echoing back its `page.cursor`. Results remain input-ordered by `queryIndex`, and per-entity failures do not erase successful siblings. Azure failures are reported with the service message plus HTTP status and error code, without the response headers the SDK appends.
