changes:
  - section: "Features Added"
    description: |
      Added read-only `--code` mode to `azmcp monitor healthmodels query` while preserving existing `--queries` behavior.
      The command now enforces `--queries` XOR `--code`.
      `--code` runs Jint JavaScript against the complete 18-operation Health Models read surface (`healthModels`, `entities`, `relationships`, `signalDefinitions`, `authenticationSettings`, `discoveryRules`, and `operations`) with Promise-based reads, up to four active operations, and no separate call-count cap.
      It enforces declared option rules: `operations.list()` has no options; `healthModels` and `authenticationSettings` list calls accept cursor-only options; timestamp-capable list calls accept `asOf` or `cursor` but reject both together; history bodies reject `nextMarker` with `startTime` or `endTime`.
      Per-read failures expose structured script error fields (`operation`, `status`, `code`, `message`) and command results keep the existing envelope `{ result, logs, error?, truncated?, azureCalls }`.
      Existing `monitor healthmodels sdk`, `graphedit`, `list`, and `get` behavior remains unchanged.
