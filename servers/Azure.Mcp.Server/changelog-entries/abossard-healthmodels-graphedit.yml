changes:
  - section: "Features Added"
    description: |
      Added **experimental** `azmcp monitor healthmodels graphedit`, the write-side sibling of `azmcp monitor healthmodels query`: a batched, selector-targeted change set over one health model's entities, relationships and signal definitions. Supported change kinds are `create` (a full-body upsert of one named resource), `patch` (an RFC 7386 merge patch, where a null value removes a property and an array replaces wholesale), `rename` and `delete`. Each `kind` is its own closed type carrying exactly the inputs it accepts, and the `--changes` option description is the JSON Schema for the batch rather than prose, so a field belonging to another kind is rejected by name instead of being silently ignored. Selectors match exactly — no globs or regexes — against a fully enumerated snapshot of each collection rather than one page, and a selector that matches nothing fails its element unless `allowEmptyMatch` is set. Results are input-ordered by `changeIndex` and report each resolved target with an action of `create`, `update`, `replace`, `delete`, `noOp` or `skipped` plus a per-property `changes[]` of `{path, before, after}`. Because relationship endpoints and resource names are create-time immutable, repointing an edge is a `replace` and a rename expands into create-under-the-new-name, a repoint of every relationship that referenced the old name, and delete-of-the-old-name; deleting an entity still referenced by a relationship is rejected by name rather than cascaded. Server-owned properties (`provisioningState`, `healthState`, `discoveredBy`, `systemData`, `id`, `name`, `type`) are rejected as input and excluded from every diff. The default `--mode whatIf` computes the whole change set and writes nothing; `--mode apply` additionally requires `--expect {"affectedCount": N}` echoed from the matching what-if and rejects the entire batch with zero writes when it is absent or differs, with an optional `--expect {"snapshot": "..."}` token rejecting the batch if a matched target drifted in between. Writes are ordered signal definitions, then entities, then relationships (deletes in reverse), and a target whose dependency failed is reported as `skipped` rather than attempted. A whole-element failure keeps its input position without erasing successful siblings.
