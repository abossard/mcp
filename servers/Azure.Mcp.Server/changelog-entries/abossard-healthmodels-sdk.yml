changes:
  - section: "Features Added"
    description: |
      Added **experimental** `azmcp monitor healthmodels sdk`, a code-mode tool that runs caller-authored JavaScript in a sandbox where the authenticated Azure CloudHealth SDK is bound to the target subscription as a `client` object. The client mirrors `@azure/arm-cloudhealth`'s `CloudHealthClient` — `client.healthModels`, `client.entities`, `client.relationships` and `client.signalDefinitions`, with the SDK's own method names and positional argument order — and is backed by the same `Azure.ResourceManager.CloudHealth` calls the other health-model tools use, so no npm package is involved. The `--code` option description is the TypeScript declaration of the sandbox globals rather than prose. Use it when an answer needs chaining, filtering, aggregation, or a loop over a model's graph: intermediate pages stay inside the sandbox and never enter the caller's context, so a scan of thousands of entities can return a single count. Reads cover `get`, `listByHealthModel`, health and signal history, signal recommendations and data annotations; writes cover `createOrUpdate`, `delete`, `addDataAnnotation` and `ingestHealthReport` and take effect immediately, with no `whatIf` preview or affected-count guard. Pagination is API-native: one Azure page per call, with the service's own `nextLink` echoed back as `options.cursor` to continue, never silently aggregated. The sandbox is built on Jint with CLR interop left off, and the CloudHealth functions are bound as `ClrFunction` values rather than CLR delegates or objects, which keeps the tool off Jint's reflection-based interop path and NativeAOT-safe. A script has no network, no filesystem, no module loading, and no route to a .NET type or to the credential the client closes over. Execution is bounded by a wall-clock timeout, a statement ceiling and a recursion limit; exceeding one is reported as an error rather than a partial result, and an oversized result is truncated with its estimated token count so the next attempt can filter inside the script instead.
